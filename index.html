const cover = document.getElementById('blog-cover');
if (cover && cover.style.display !== 'none') {
  const startBtn = document.getElementById('start-journey');
  
  import('https://cdn.jsdelivr.net/npm/threejs-components@0.0.30/build/backgrounds/liquid1.min.js').then((module) => {
    const LiquidBackground = module.default;

    // ★★★ 动态读取配置文件中的轮播图数组，如果没配提供默认图 ★★★
    const coverImages = ["/images/10.png","/images/14.png","/images/15.png","/images/13.jpg"];
    
    const canvas1 = document.getElementById('refraction-canvas-1');
    const canvas2 = document.getElementById('refraction-canvas-2');
    
    const setupApp = (canvas) => {
      const app = LiquidBackground(canvas);
      app.liquidPlane.material.metalness = 0.35;
      app.liquidPlane.material.roughness = 0.45;
      app.liquidPlane.uniforms.displacementScale.value = 2;
      app.setRain(false);
      return app;
    }

    const app1 = setupApp(canvas1);
    const app2 = setupApp(canvas2);

    let currentSlide = 0;
    let activeApp = 1;
    
    if (coverImages.length > 0) {
      app1.loadImage(coverImages[0]);
    }
    if (coverImages.length > 1) {
      app2.loadImage(coverImages[1]);
    }

    let slideTimer = null;
    if (coverImages.length > 1) {
      slideTimer = setInterval(() => {
        const nextSlide = (currentSlide + 1) % coverImages.length;
        
        if (activeApp === 1) {
          canvas1.classList.remove('active');
          canvas2.classList.add('active');
          activeApp = 2;
          setTimeout(() => app1.loadImage(coverImages[(nextSlide + 1) % coverImages.length]), 1500);
        } else {
          canvas2.classList.remove('active');
          canvas1.classList.add('active');
          activeApp = 1;
          setTimeout(() => app2.loadImage(coverImages[(nextSlide + 1) % coverImages.length]), 1500);
        }
        currentSlide = nextSlide;
      }, 5000); 
    }

    // 绑定关闭封面的事件 (兼容电脑点击和手机触摸)
    const closeCover = (e) => {
      if (e && e.cancelable) e.preventDefault();
      cover.classList.add('slide-up');
      sessionStorage.setItem('hasSeenCover', 'true');
      document.body.style.overflow = '';
      
      setTimeout(() => {
        cover.style.display = 'none';
        if (slideTimer) clearInterval(slideTimer);
        if (app1.dispose) app1.dispose();
        if (app2.dispose) app2.dispose();
      }, 800);
    };

    startBtn.addEventListener('click', closeCover);
    startBtn.addEventListener('touchstart', closeCover, { passive: false });
  });

  // =======================
  // ★ 翻译处理：向全局 lang-switch 请求数据 ★
  // =======================
  const splitAndAnimateText = (text, container, popBaseDelay = 0) => {
    container.innerHTML = ''; // 清空内容
    text.split('').forEach((char, index) => {
      if (char === ' ') {
        const space = document.createElement('span');
        space.innerHTML = '&nbsp;';
        container.appendChild(space);
        return;
      }
      const wrapper = document.createElement('span');
      wrapper.className = 'pop-wrapper';
      wrapper.style.animationDelay = `${popBaseDelay + index * 0.05}s`;
      
      const inner = document.createElement('span');
      inner.textContent = char;
      inner.className = 'wave-inner';
      inner.style.animationDelay = `${index * 0.15}s`; 
      
      wrapper.appendChild(inner);
      container.appendChild(wrapper);
    });
  };

  // ★★★ 从配置文件动态获取文字 (依然保留原先的语言翻译支持机制) ★★★
  const configTitle = "欢迎来到晴空四叶草的秘密基地";
  const configAuthor = "晴空四叶草";
  const configBtn = "开始你的旅行";

  // 稍微延迟 100ms 等待 lang-switch 注册好全局 window.i18n
  setTimeout(() => {
    const titleStr = (window.i18n && window.i18n.get) ? window.i18n.get(configTitle) : configTitle;
    const authorStr = (window.i18n && window.i18n.get) ? window.i18n.get(configAuthor) : configAuthor;
    const btnStr = (window.i18n && window.i18n.get) ? window.i18n.get(configBtn) : configBtn;

    document.getElementById('start-journey-text').textContent = btnStr;
    splitAndAnimateText(titleStr, document.getElementById('animated-title'), 0);
    splitAndAnimateText(authorStr, document.getElementById('animated-author'), 0.5);
  }, 100);
}</script><div id="app"><header class="header navbar-bubble"><nav class="nav"><div class="nav-container"><div class="nav-logo"><a href="/"><span class="nav-title">晴空四叶草</span></a></div><div class="nav-menu"><a class="nav-item active" href="/">首页</a><a class="nav-item" href="/about/">关于</a><a class="nav-item" href="/archives/">归档</a><a class="nav-item" href="/categories/">分类</a><a class="nav-item" href="/tags/">标签</a><a class="nav-item" href="/link/">友链</a><a class="nav-item" href="/murmur/">碎碎念</a><a class="nav-item" href="#lang-switch">Language</a><div class="nav-item has-submenu"><span class="nav-link">网站</span><div class="submenu"><a class="submenu-item" target="_blank" rel="noopener" href="https://punkpin.github.io/">旧博客（2024—2026）</a></div></div><!-- 搜索按钮--><div class="search-toggle"><i class="fas fa-search"></i></div></div><div class="nav-toggle"><span></span><span></span><span></span></div></div></nav></header><div class="theme-color-picker-container"><label for="theme-color-picker" data-title="自定义主题色"><i class="fas fa-palette"></i></label><input type="color" id="theme-color-picker" value="#18D1FF"/></div><style>.theme-color-picker-container {

document.addEventListener('DOMContentLoaded', function() {
  const colorPicker = document.getElementById('theme-color-picker');
  const root = document.documentElement;
  
  // 初始化颜色选择器的UI显示值
  const savedColor = localStorage.getItem('custom-accent-color');
  if (savedColor) {
    colorPicker.value = savedColor;
  }

  // 监听：颜色面板拖动时（实时更新整个网站的颜色）
  colorPicker.addEventListener('input', function(e) {
    const newColor = e.target.value;
    root.style.setProperty('--accent-color', newColor);
    
    // ★ 修复 Bug：如果在 iframe 模态框中修改颜色，实时同步给主窗口(父界面)
    if (window.self !== window.top) {
      try {
        window.top.document.documentElement.style.setProperty('--accent-color', newColor);
        const parentPicker = window.top.document.getElementById('theme-color-picker');
        if (parentPicker) parentPicker.value = newColor;
      } catch(err) {
        // 忽略跨域错误
      }
    }
  });

  // 监听：颜色选择完毕关闭面板时（保存到浏览器缓存，下次打开依然有效）
  colorPicker.addEventListener('change', function(e) {
    const newColor = e.target.value;
    localStorage.setItem('custom-accent-color', newColor);
  });

  // ★ 修复 Bug：监听 localStorage 变化。如果主页颜色改变，通知到所有开启的模态框 iframe 或者 其他标签页
  window.addEventListener('storage', function(e) {
    if (e.key === 'custom-accent-color' && e.newValue) {
      root.style.setProperty('--accent-color', e.newValue);
      if (colorPicker) colorPicker.value = e.newValue;
    }
  });
